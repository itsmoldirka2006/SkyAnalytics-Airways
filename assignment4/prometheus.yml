global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  - job_name: 'postgres'
    static_configs:
      - targets: ['db_exporter:9187']
    scrape_interval: 20s
    metrics_path: /metrics

  - job_name: 'node'
    static_configs:
      - targets: ['node_exporter:9100']
    scrape_interval: 15s

  - job_name: 'custom_exporter'
    static_configs:
      - targets: ['custom_exporter:8010']
    scrape_interval: 20s

  - job_name: 'prometheus'
    static_configs:
      - targets: ['localhost:9090']