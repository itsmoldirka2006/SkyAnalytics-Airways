catalog: skyanalytics_airways
schema: public
sql: 'SELECT bk.booking_platform, ROUND(AVG(b.weight_in_kg), 2) AS avg_weight

  FROM booking bk

  JOIN baggage b ON bk.booking_id = b.booking_id

  GROUP BY bk.booking_platform

  ORDER BY avg_weight DESC

  LIMIT 10;'
